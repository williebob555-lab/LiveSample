appId: com.livesample.app
productName: LiveSample
# electron-builder names the Linux executable after this; keep it lowercase and
# matching StartupWMClass in linux/livesample.desktop.in.
executableName: livesample
directories:
  output: release
  buildResources: build

# Use the Electron already in node_modules rather than re-downloading and
# re-extracting it — same version by construction, and it avoids the Windows
# Defender rename race LivePatch hit (EPERM on win-unpacked.tmp).
electronDist: node_modules/electron/dist

# The audio host is a utilityProcess that loads audify's .node binary (and on
# Linux its librtaudio.so beside it). Native binaries cannot load from inside
# an asar, so leave the app unpacked; it is small either way.
asar: false

# audify ships prebuilt N-API binaries that already load under Electron 35+;
# rebuilding would need a compiler toolchain for nothing.
npmRebuild: false

files:
  - dist/**
  - dist-host/**
  - electron/**
  - package.json
  - '!**/*.map'

# Windows: per-user NSIS install — no UAC, and somewhere the updater can always
# write. NSIS is also the only Windows target electron-updater can update.
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LiveSample
  # Projects live wherever the user saved them; settings in %APPDATA%. Never
  # take either with the uninstaller.
  deleteAppDataOnUninstall: false
  artifactName: LiveSample-${version}-setup.${ext}

# Linux: AppImage is the one format that updates itself in place (Fedora KDE
# included). Runtime libraries audify links against — alsa-lib and
# pulseaudio-libs — are on every desktop install.
linux:
  target: [AppImage]
  category: Audio
  # Keeps the window's Wayland app_id / WM_CLASS in step with the .desktop file.
  syncDesktopName: true
  synopsis: Capture, map and export multisampled instruments
  desktop:
    entry:
      StartupWMClass: livesample
      Keywords: sampler;sfz;decentsampler;instrument;recording;
appImage:
  artifactName: LiveSample-${version}-x86_64.${ext}

# Where releases are uploaded and where the app checks for updates. Owner and
# repo come from package.json "repository". Downloads are anonymous, so the
# releases must be readable without a token — see README "Releases".
publish:
  provider: github
  releaseType: release
